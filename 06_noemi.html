<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación 6 - Noemi</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @media (min-width: 901px) {
            .pc-row { flex-direction: row !important; }
        }

        /* --- ANIMACIONES PERSONALIZADAS --- */
        @keyframes tarjetaEntrada {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes latidoEsfuerzo {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 6px rgba(255, 152, 0, 0.5)); }
            100% { transform: scale(1); }
        }

        /* Cascada de entrada para los elementos */
        .paso-animado-1 { animation: tarjetaEntrada 0.6s ease forwards 0.2s; opacity: 0; }
        .paso-animado-2 { animation: tarjetaEntrada 0.6s ease forwards 0.4s; opacity: 0; }
        .paso-animado-3 { animation: tarjetaEntrada 0.6s ease forwards 0.6s; opacity: 0; }
        .imagen-animada { animation: tarjetaEntrada 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards 0.5s; opacity: 0; }

        /* Icono con animación activa para esfuerzo */
        .vector-icono {
            display: inline-block;
            animation: latidoEsfuerzo 1.8s ease-in-out infinite;
            vertical-align: middle;
        }

        /* Efecto hover interactivo en las tarjetas */
        .tarjeta-texto {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .tarjeta-texto:hover {
            transform: translateX(8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="diapositiva">
        <!-- Encabezado -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #d32f2f; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <h1 style="margin: 0; border: none; padding: 0; display: flex; align-items: center; gap: 15px; font-size: 1.65em; color: #d32f2f;">
                <img src="img/noemi.jpg" alt="Noemi" class="avatar-titulo">
                Desarrollo - Escenario 2 (Esfuerzo)
            </h1>
            <img src="img/logo-01.png" alt="Logo UTP" style="height: 48px; object-fit: contain;">
        </div>
        
        <!-- Contenedor Principal Maestro -->
        <div class="layout-pc-maestro">
            <div class="columna-contenido-principal pc-row" style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
                
                <!-- Columna de Cálculos con Animación en Cascada -->
                <div style="flex: 1; width: 100%; display: flex; flex-direction: column; gap: 10px;">
                    <h3 style="color: #444; margin-top: 0; font-size: 1.1em;">🏃‍♂️ Datos iniciales: 24 respiraciones / 60 s</h3>
                    
                    <!-- Paso 1 -->
                    <div class="tarjeta-texto paso-animado-1" style="border-left-color: #ff9800; background: linear-gradient(145deg, #ffffff, #fff3e0); padding: 10px 15px;">
                        <h4 style="margin: 0 0 3px 0; color: #e65100; font-size: 0.95em; display: flex; align-items: center; gap: 8px;">
                            <span class="vector-icono">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e65100" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                            </span>
                            Paso 1: Frecuencia en Hercios (f)
                        </h4>
                        <div style="font-size: 1.05em; font-family: 'Courier New', Courier, monospace; background: rgba(255,152,0,0.1); padding: 5px; border-radius: 6px; text-align: center; color: #bf360c; font-weight: bold;">
                            f = 24 / 60 = 0,40 Hz
                        </div>
                    </div>

                    <!-- Paso 2 -->
                    <div class="tarjeta-texto paso-animado-2" style="border-left-color: #f44336; background: linear-gradient(145deg, #ffffff, #ffebee); padding: 10px 15px;">
                        <h4 style="margin: 0 0 3px 0; color: #c62828; font-size: 0.95em; display: flex; align-items: center; gap: 8px;">
                            <span class="vector-icono">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            </span>
                            Paso 2: Cálculo del Período (T)
                        </h4>
                        <div style="font-size: 1.05em; font-family: 'Courier New', Courier, monospace; background: rgba(244,67,54,0.1); padding: 5px; border-radius: 6px; text-align: center; color: #b71c1c; font-weight: bold;">
                            T = 1 / 0,40 = 2,5 s
                        </div>
                    </div>

                    <!-- Paso 3 -->
                    <div class="tarjeta-texto paso-animado-3" style="border-left-color: #9c27b0; background: linear-gradient(145deg, #ffffff, #f3e5f5); padding: 10px 15px;">
                        <h4 style="margin: 0 0 3px 0; color: #7b1fa2; font-size: 0.95em; display: flex; align-items: center; gap: 8px;">
                            <span class="vector-icono">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                            </span>
                            Paso 3: Frecuencia Angular (&omega;)
                        </h4>
                        <div style="font-size: 1.05em; font-family: 'Courier New', Courier, monospace; background: rgba(156,39,176,0.1); padding: 5px; border-radius: 6px; text-align: center; color: #4a148c; font-weight: bold;">
                            &omega; = 2 &times; 3,1416 &times; 0,40 = 2,51 rad/s
                        </div>
                    </div>
                </div>

                <!-- Gráfico lateral con animación -->
                <div class="imagen-animada" style="width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: center;">
                    <img src="img/grafico_esfuerzo.jpg" alt="Física de un ciclo respiratorio durante esfuerzo" style="width: 100%; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border: 3px solid white; object-fit: contain; background: #fff;">
                </div>
            </div>

            <!-- Columna Derecha: Video y Navegación lateral -->
            <div class="columna-video-lateral">
                <video id="videoExpositor" class="video-expositor" autoplay controls>
                    <source src="videos/06_noemi.mp4" type="video/mp4">
                </video>
                <div class="contenedor-botones">
                    <a href="05_marienela.html" class="nav-btn">◀ Anterior</a>
                    <a href="07_Cinthia.html" class="nav-btn">Siguiente ▶</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var video = document.getElementById("videoExpositor");
            video.volume = 1.0;
            video.addEventListener("ended", function() {
                window.location.href = "07_Cinthia.html";
            });
        });
    </script>
</body>
</html>

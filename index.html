<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis físico-fisiológico del ciclo respiratorio - UTP</title>
    <!-- Conexión a tu archivo de estilos global -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos y exclusivos para la Portada Principal */
        .portada-principal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 80%;
            max-width: 850px;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            text-align: center;
            animation: slideUpFade 1s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            border-top: 6px solid #d32f2f;
        }
        .logo-utp-portada {
            height: 60px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: fadeIn 1s ease forwards 0.2s;
            opacity: 0;
        }
        .portada-principal h1 {
            color: #d32f2f;
            font-size: 2.2em;
            margin-bottom: 15px;
            border: none;
            padding: 0;
            animation: fadeInDown 1.2s ease forwards 0.4s;
            opacity: 0;
        }
        .portada-principal h2 {
            color: #555;
            font-size: 1.25em;
            font-weight: 500;
            margin-bottom: 10px;
            animation: fadeIn 1.2s ease forwards 0.6s;
            opacity: 0;
        }
        .portada-principal .curso-info {
            color: #777;
            font-size: 1em;
            margin-bottom: 35px;
            animation: fadeIn 1.2s ease forwards 0.8s;
            opacity: 0;
        }
        
        /* Contenedor de botones de acción en la portada */
        .contenedor-acciones {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            animation: fadeIn 1s forwards 1s;
            opacity: 0;
        }

        .btn-comenzar {
            background-color: #d32f2f;
            color: white;
            padding: 16px 40px;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
            display: inline-block;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }
        .btn-comenzar:hover {
            background-color: #b71c1c;
            transform: scale(1.04);
            box-shadow: 0 10px 25px rgba(211, 47, 47, 0.6);
        }

        /* Grupo de botones secundarios para descargas */
        .grupo-descargas {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 480px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-descargar {
            background-color: #fff;
            color: #444;
            border: 2px solid #ccc;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: bold;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 200px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .btn-descargar.word:hover {
            border-color: #2b579a;
            color: #2b579a;
            background-color: #f0f4f8;
            transform: translateY(-2px);
        }

        .btn-descargar.pdf:hover {
            border-color: #d32f2f;
            color: #d32f2f;
            background-color: #fdf2f2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="portada-principal">
        <!-- Logo institucional UTP -->
        <img src="img/logo-01.png" alt="Logo UTP" class="logo-utp-portada">
        
        <h1>Análisis físico-fisiológico del ciclo respiratorio</h1>
        <h2>Universidad Tecnológica del Perú — Grupo 1</h2>
        <div class="curso-info">
            <strong>Curso:</strong> Física para CC.SS. | <strong>Sección:</strong> 36401
        </div>

        <!-- Botones de Acción -->
        <div class="contenedor-acciones">
            <!-- Botón principal para iniciar -->
            <a href="01_hans.html" class="btn-comenzar">Iniciar Exposición ▶</a>

            <!-- Botones de descarga de documentos -->
            <div class="grupo-descargas">
                <a href="archivos/informe.docx" download class="btn-descargar word">
                    📄 Descargar Informe (Word)
                </a>
                <a href="archivos/presentacion.pdf" download class="btn-descargar pdf">
                    📊 Descargar Presentación (PDF)
                </a>
            </div>
        </div>
    </div>
</body>
</html>
